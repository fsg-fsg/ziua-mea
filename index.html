<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111418">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Ziua Mea</title>
<style>
:root{--bg:#111418;--card:#1b2027;--card2:#232a33;--txt:#e8ecf1;--mut:#8a94a3;--acc:#4f9dff;--ok:#3ecf8e;--warn:#ffb547;--seg:#2c343e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--txt);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;padding-bottom:40px;user-select:none;-webkit-user-select:none}
header{position:sticky;top:0;background:var(--bg);padding:12px 16px 8px;z-index:5;border-bottom:1px solid #1f252d}
.timer{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px}
.timer>div{flex:1}
.timer .t{font-size:28px;font-variant-numeric:tabular-nums;font-weight:600;line-height:1.1}
.timer .sub{font-size:12px;color:var(--mut)}
button{font:inherit;color:inherit;background:var(--card2);border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
button:active{filter:brightness(1.3)}
button.pri{background:var(--acc);color:#fff}
#tb.run{background:var(--warn);color:#111}
.datebar{display:flex;align-items:center;gap:8px;margin-top:10px}
.datebar .d{font-weight:600;text-align:center;flex:1;text-transform:capitalize}
.datebar .d small{color:var(--acc);font-weight:500;text-transform:none}
main{padding:12px 16px;min-height:60vh}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:20px 0 8px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;transition:transform .1s}
.card:active{transform:scale(.98)}
.card.done{opacity:.6}
.card .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.card .name{font-weight:600;font-size:17px}
.info{color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{display:flex;gap:4px;height:14px}
.seg{flex:1;background:var(--seg);border-radius:4px;overflow:hidden}
.seg i{display:block;height:100%;background:var(--c);transition:width .2s}
.card.done .seg i{background:var(--ok)}
.empty{color:var(--mut);text-align:center;padding:24px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:20}
.ov.hidden{display:none}
.sheet{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sh-h b{font-size:20px;flex:1}
.segs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sb{position:relative;background:var(--card);border-radius:14px;height:88px;overflow:hidden;padding:12px;display:flex;flex-direction:column;justify-content:space-between;touch-action:manipulation}
.sb i{position:absolute;left:0;top:0;bottom:0;background:var(--c);opacity:.35;transition:width .2s}
.sb.full i{opacity:.65}
.sb span,.sb em{position:relative}
.sb span{font-weight:600}
.sb em{font-style:normal;color:var(--mut);font-variant-numeric:tabular-nums;font-size:20px}
.sb.full em{color:var(--txt)}
.hint{color:var(--mut);font-size:13px;text-align:center;margin-top:14px}
label{display:block;margin:10px 0;color:var(--mut);font-size:13px}
label input,label select{display:block;width:100%;margin-top:4px}
input,select{font:inherit;color:var(--txt);background:var(--card);border:1px solid #2c343e;border-radius:10px;padding:10px;user-select:text;-webkit-user-select:text}
.lbl{color:var(--mut);font-size:13px;margin:12px 0 6px}
.days{display:flex;gap:5px}
.days button{flex:1;padding:10px 0;font-size:14px}
.days button.on{background:var(--acc);color:#fff}
.two{display:flex;gap:10px}
.two label{flex:1;min-width:0}
.srow{display:flex;gap:6px;margin-bottom:6px}
.srow input:first-child{flex:1;min-width:0}
.srow input[type=number]{width:84px}
.btns{display:flex;gap:10px;margin-top:14px}
.btns button{flex:1}
.wide{width:100%;margin-top:8px}
.danger{background:#3a1f24;color:#ff8a8a}
.tr{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.tn{flex:1;min-width:0}
.tn small{display:block;color:var(--mut);font-size:12px}
</style>
</head>
<body>
<header>
  <div class="timer">
    <div><div class="t" id="tt">0:00:00</div><div class="sub">Muncă azi</div></div>
    <button id="tb" class="pri">▶ Start</button>
    <button id="set" aria-label="Setări">⚙</button>
  </div>
  <div class="datebar">
    <button id="prev">‹</button>
    <div class="d" id="dl"></div>
    <button id="next">›</button>
  </div>
</header>
<main id="main"></main>
<div class="ov hidden" id="ov"><div class="sheet" id="sh"></div></div>
<input type="file" id="file" accept="application/json,.json" hidden>

<script>
const KEY='ziua-mea-v1';
const COL={check:'#b07cff',sets:'#ff7a59',water:'#4fc3ff',work:'#ffb547'};
const TYPES={check:'Bifă (ex. pastilă)',sets:'Seturi (ex. sport)',water:'Apă (ml)',work:'Muncă (ore)'};
const DAYS=['D','L','Ma','Mi','J','V','S']; // index = getDay(), 0 = duminică
const ALL=[0,1,2,3,4,5,6];
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ds=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const hours=n=>Array.from({length:n},(_,k)=>({name:'Ora '+(k+1),target:1}));

function defSegs(type){
  if(type==='check')return[{name:'Gata',target:1}];
  if(type==='water')return[{name:'Pahar 1',target:250}];
  if(type==='work')return hours(6);
  return[{name:'',target:3}];
}
function defaults(){return{
  templates:[
    {id:uid(),name:'Pastilă',type:'check',days:ALL.slice(),segments:defSegs('check')},
    {id:uid(),name:'Sport',type:'sets',days:[2],segments:[
      {name:'Umeri',target:4},{name:'Flotări',target:4},{name:'Genuflexiuni',target:5},
      {name:'Gambe',target:4},{name:'Laterale',target:3},{name:'Gât',target:3}]},
    {id:uid(),name:'Apă',type:'water',days:ALL.slice(),segments:[250,250,500,250,250,500].map((m,i)=>({name:'Pahar '+(i+1),target:m}))},
    {id:uid(),name:'Muncă',type:'work',days:[1,2,3,4,5],segments:hours(6)}
  ],
  logs:{}, work:{}, timer:{start:null,date:null}
}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.templates)return Object.assign(defaults(),s)}catch(e){}return defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Nu am putut salva datele')}}

let S=load();
let cur=new Date();cur.setHours(12,0,0,0);
let sheetMode=null,sheetId=null,E=null;
const tpl=id=>S.templates.find(t=>t.id===id);

/* ---------- logică ---------- */
function active(t,d){const s=ds(d);return t.days.includes(d.getDay())&&(!t.from||s>=t.from)&&(!t.to||s<=t.to)}
function workMs(date){return(S.work[date]||0)+(S.timer.start&&S.timer.date===date?Date.now()-S.timer.start:0)}
function prog(t,date){
  if(t.type==='work'){const h=workMs(date)/3600000;return t.segments.map((s,i)=>Math.max(0,Math.min(1,h-i)))}
  const p=(S.logs[date]||{})[t.id]||[];return t.segments.map((s,i)=>p[i]||0);
}
function frac(t,p){return t.segments.map((s,i)=>t.type==='sets'?Math.min(1,p[i]/s.target):t.type==='work'?p[i]:(p[i]?1:0))}
function fmt(ms){const m=Math.floor(ms/60000);return`${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`}
function fmtT(ms){const s=Math.floor(ms/1000);return`${Math.floor(s/3600)}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function daysTxt(d){return d.length===7?'zilnic':[1,2,3,4,5,6,0].filter(x=>d.includes(x)).map(x=>DAYS[x]).join(' ')||'nicio zi'}
function infoText(t,p,date){
  switch(t.type){
    case'check':return p[0]?'făcut':'tap = bifă';
    case'sets':{const a=p.reduce((x,y)=>x+y,0),b=t.segments.reduce((x,s)=>x+s.target,0),e=t.segments.filter((s,i)=>p[i]>=s.target).length;return`${e}/${t.segments.length} · ${a}/${b} seturi`}
    case'water':{const a=t.segments.reduce((x,s,i)=>x+(p[i]?s.target:0),0),b=t.segments.reduce((x,s)=>x+s.target,0);return`${a} / ${b} ml`}
    case'work':return`${fmt(workMs(date))} / ${t.segments.length}h`;
  }
}
function change(t,i,d){
  const date=ds(cur);
  const L=S.logs[date]||(S.logs[date]={});
  const p=L[t.id]||(L[t.id]=[]);
  while(p.length<t.segments.length)p.push(0);
  if(t.type==='sets')p[i]=Math.max(0,Math.min(t.segments[i].target,(p[i]||0)+d));
  else p[i]=d>0?(p[i]?0:1):0; // apă / bifă: tap comută, ținut apăsat golește
  if(navigator.vibrate)navigator.vibrate(d>0?12:35);
  save();render();renderSheet();
}

/* ---------- pagina principală ---------- */
function cardHTML(t,p,f,ok,date){
  return`<div class="card ${ok?'done':''}" data-id="${t.id}" style="--c:${COL[t.type]}">
    <div class="row"><span class="name">${ok?'✓ ':''}${esc(t.name)}</span><span class="info">${infoText(t,p,date)}</span></div>
    <div class="bar">${f.map(x=>`<div class="seg"><i style="width:${x*100}%"></i></div>`).join('')}</div></div>`;
}
function render(){
  const date=ds(cur),today=ds(new Date());
  $('#dl').innerHTML=esc(cur.toLocaleDateString('ro-RO',{weekday:'long',day:'numeric',month:'long'}))+(date===today?' <small>· azi</small>':'');
  const list=S.templates.filter(t=>active(t,cur));
  const pend=[],done=[];
  list.forEach(t=>{const p=prog(t,date),f=frac(t,p),ok=f.every(x=>x>=1);(ok?done:pend).push(cardHTML(t,p,f,ok,date))});
  $('#main').innerHTML=(pend.length?pend.join(''):`<p class="empty">${list.length?'Totul e făcut 🎉':'Nimic programat în ziua asta.'}</p>`)
    +(done.length?'<h3>Făcut</h3>'+done.join(''):'');
}
// actualizare în loc (fără rebuild) pentru cardul de muncă cât merge timer-ul
function updateWork(){
  const date=ds(cur);
  for(const t of S.templates.filter(t=>t.type==='work')){
    const c=document.querySelector(`.card[data-id="${t.id}"]`);if(!c)continue;
    const p=prog(t,date),f=frac(t,p);
    if(f.every(x=>x>=1)!==c.classList.contains('done')){render();return}
    c.querySelector('.info').textContent=infoText(t,p,date);
    c.querySelectorAll('.seg i').forEach((el,i)=>el.style.width=f[i]*100+'%');
  }
  if(sheetMode==='detail'){
    const t=tpl(sheetId);if(!t||t.type!=='work')return;
    const p=prog(t,date),f=frac(t,p);
    $('#sh .sh-h .info').textContent=infoText(t,p,date);
    document.querySelectorAll('#sh .sb').forEach((el,i)=>{el.querySelector('i').style.width=f[i]*100+'%';el.querySelector('em').textContent=Math.round(f[i]*100)+'%';el.classList.toggle('full',f[i]>=1)});
  }
}
$('#main').addEventListener('click',e=>{
  const c=e.target.closest('.card');if(!c)return;
  const t=tpl(c.dataset.id);if(!t)return;
  if(t.type==='check')change(t,0,1);else openSheet(t.id);
});

/* ---------- timer ---------- */
function tick(){
  $('#tt').textContent=fmtT(workMs(ds(new Date())));
  const r=!!S.timer.start;$('#tb').textContent=r?'❚❚ Pauză':'▶ Start';$('#tb').classList.toggle('run',r);
}
$('#tb').onclick=()=>{
  if(S.timer.start){const d=S.timer.date;S.work[d]=(S.work[d]||0)+Date.now()-S.timer.start;S.timer={start:null,date:null}}
  else S.timer={start:Date.now(),date:ds(new Date())};
  save();tick();render();
};
setInterval(()=>{tick();if(S.timer.start&&ds(cur)===S.timer.date)updateWork()},1000);

/* ---------- navigare zile ---------- */
function shift(n){cur.setDate(cur.getDate()+n);render()}
$('#prev').onclick=()=>shift(-1);
$('#next').onclick=()=>shift(1);
$('#dl').onclick=()=>{cur=new Date();cur.setHours(12,0,0,0);render()};
let sx=null,sy=null;
$('#main').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$('#main').addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)shift(dx<0?1:-1);sx=null},{passive:true});

/* ---------- foaia de jos (detaliu / setări / editor) ---------- */
function openSheet(id){sheetMode='detail';sheetId=id;showSheet()}
function openEditor(id){
  const t=tpl(id);
  E=t?JSON.parse(JSON.stringify(t)):{id:uid(),name:'',type:'sets',days:ALL.slice(),segments:defSegs('sets'),from:'',to:'',isNew:true};
  sheetMode='edit';showSheet();
}
function showSheet(){$('#ov').classList.remove('hidden');renderSheet();$('#sh').scrollTop=0}
function closeSheet(){$('#ov').classList.add('hidden');sheetMode=null;render()}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeSheet()});
$('#set').onclick=()=>{sheetMode='settings';showSheet()};

function renderSheet(){
  if(!sheetMode)return;
  $('#sh').innerHTML=sheetMode==='detail'?detailHTML():sheetMode==='settings'?settingsHTML():editHTML();
}
function detailHTML(){
  const t=tpl(sheetId);if(!t)return'';
  const date=ds(cur),p=prog(t,date),f=frac(t,p);
  let h=`<div class="sh-h"><b>${esc(t.name)}</b><span class="info">${infoText(t,p,date)}</span><button data-a="close">✕</button></div><div class="segs">`;
  t.segments.forEach((s,i)=>{
    const lab=t.type==='sets'?`${p[i]}/${s.target}`:t.type==='water'?`${s.target} ml`:t.type==='work'?`${Math.round(f[i]*100)}%`:(p[i]?'✓':'');
    h+=`<div class="sb ${f[i]>=1?'full':''}" data-i="${i}" style="--c:${COL[t.type]}"><i style="width:${f[i]*100}%"></i><span>${esc(s.name)}</span><em>${lab}</em></div>`;
  });
  h+='</div>';
  if(t.type==='work')h+=`<div class="btns"><button data-a="w-">−15 min</button><button data-a="w+">+15 min</button></div><p class="hint">Se umple din timer-ul de sus. Butoanele corectează manual.</p>`;
  else if(t.type==='water')h+=`<p class="hint">Tap = umple / golește paharul</p>`;
  else h+=`<p class="hint">Tap = +1 set · Ține apăsat = −1</p>`;
  return h;
}
function settingsHTML(){
  let h=`<div class="sh-h"><b>Setări</b><button data-a="close">✕</button></div>`;
  S.templates.forEach((t,i)=>{
    h+=`<div class="tr"><span class="dot" style="background:${COL[t.type]}"></span><span class="tn">${esc(t.name)}<small>${TYPES[t.type]} · ${daysTxt(t.days)}</small></span>
      <button data-a="up" data-i="${i}" ${i?'':'disabled style="opacity:.3"'}>↑</button><button data-a="ed" data-id="${t.id}">✎</button></div>`;
  });
  h+=`<button class="pri wide" data-a="new">+ Activitate nouă</button>
    <h3>Date</h3><div class="btns"><button data-a="exp">Export backup</button><button data-a="imp">Import backup</button></div>
    <div class="btns"><button data-a="reset" class="danger">Resetează tot</button></div>`;
  return h;
}
function editHTML(){
  let h=`<div class="sh-h"><b>${E.isNew?'Activitate nouă':'Editează'}</b><button data-a="back">‹ Înapoi</button></div>
    <label>Nume<input data-f="name" value="${esc(E.name)}" placeholder="ex. Vitamina D"></label>
    <label>Tip<select data-f="type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${E.type===k?'selected':''}>${v}</option>`).join('')}</select></label>
    <div class="lbl">Zile</div><div class="days">${[1,2,3,4,5,6,0].map(d=>`<button data-a="day" data-d="${d}" class="${E.days.includes(d)?'on':''}">${DAYS[d]}</button>`).join('')}</div>
    <div class="two"><label>De la (opțional)<input type="date" data-f="from" value="${E.from||''}"></label><label>Până la (opțional)<input type="date" data-f="to" value="${E.to||''}"></label></div>`;
  if(E.type==='work')h+=`<label>Ore pe zi<input type="number" min="1" max="16" data-f="hours" value="${E.segments.length}"></label>`;
  else if(E.type!=='check'){
    h+=`<div class="lbl">${E.type==='water'?'Pahare (ml fiecare)':'Exerciții (nr. seturi)'}</div>`;
    E.segments.forEach((s,i)=>{h+=`<div class="srow"><input data-f="sn" data-i="${i}" value="${esc(s.name)}" placeholder="Nume"><input type="number" min="1" data-f="st" data-i="${i}" value="${s.target}"><button data-a="delseg" data-i="${i}">✕</button></div>`});
    h+=`<button data-a="addseg" class="wide">+ Adaugă ${E.type==='water'?'pahar':'exercițiu'}</button>`;
  }
  h+=`<div class="btns"><button class="pri" data-a="save">Salvează</button>${E.isNew?'':'<button data-a="del" class="danger">Șterge</button>'}</div>`;
  return h;
}

const sh=$('#sh');
// tap / ține apăsat pe segmente
let lpT=null,lpFired=false,lpI=null;
function lpClear(){if(lpT)clearTimeout(lpT);lpT=null;lpI=null}
sh.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.sb');if(!b||sheetMode!=='detail')return;
  const t=tpl(sheetId);if(!t||t.type==='work')return;
  lpI=+b.dataset.i;lpFired=false;
  lpT=setTimeout(()=>{lpFired=true;lpT=null;change(t,lpI,-1)},450);
});
sh.addEventListener('pointerup',()=>{
  if(lpI==null)return;
  const i=lpI,fired=lpFired;lpClear();
  if(!fired)change(tpl(sheetId),i,1);
});
sh.addEventListener('pointercancel',lpClear);
sh.addEventListener('contextmenu',e=>e.preventDefault());

sh.addEventListener('input',e=>{
  if(sheetMode!=='edit')return;
  const el=e.target,f=el.dataset.f,i=+el.dataset.i;
  if(f==='name')E.name=el.value;
  else if(f==='from')E.from=el.value;
  else if(f==='to')E.to=el.value;
  else if(f==='sn')E.segments[i].name=el.value;
  else if(f==='st')E.segments[i].target=Math.max(1,+el.value||1);
  else if(f==='hours')E.segments=hours(Math.max(1,Math.min(16,+el.value||1)));
});
sh.addEventListener('change',e=>{
  if(sheetMode==='edit'&&e.target.dataset.f==='type'){E.type=e.target.value;E.segments=defSegs(E.type);renderSheet()}
});
sh.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a;
  switch(a){
    case'close':closeSheet();break;
    case'back':sheetMode='settings';renderSheet();break;
    case'w+':case'w-':{const d=ds(cur);S.work[d]=Math.max(0,(S.work[d]||0)+(a==='w+'?1:-1)*900000);save();render();renderSheet();tick();break}
    case'up':{const i=+b.dataset.i;if(i>0){[S.templates[i-1],S.templates[i]]=[S.templates[i],S.templates[i-1]];save();renderSheet()}break}
    case'ed':openEditor(b.dataset.id);break;
    case'new':openEditor(null);break;
    case'day':{const d=+b.dataset.d;E.days=E.days.includes(d)?E.days.filter(x=>x!==d):[...E.days,d];renderSheet();break}
    case'addseg':E.segments.push(E.type==='water'?{name:'Pahar '+(E.segments.length+1),target:250}:{name:'',target:3});renderSheet();break;
    case'delseg':if(E.segments.length>1){E.segments.splice(+b.dataset.i,1);renderSheet()}break;
    case'save':{
      if(!E.name.trim()){alert('Pune un nume');break}
      E.name=E.name.trim();
      E.segments.forEach((s,k)=>{if(!s.name.trim())s.name=(E.type==='water'?'Pahar ':'Exercițiu ')+(k+1)});
      delete E.isNew;
      const i=S.templates.findIndex(x=>x.id===E.id);
      if(i>=0)S.templates[i]=E;else S.templates.push(E);
      save();sheetMode='settings';renderSheet();break;
    }
    case'del':if(confirm('Ștergi „'+E.name+'”?')){S.templates=S.templates.filter(x=>x.id!==E.id);save();sheetMode='settings';renderSheet()}break;
    case'exp':exportData();break;
    case'imp':$('#file').click();break;
    case'reset':if(confirm('Ștergi toate datele și setările?')){S=defaults();save();closeSheet();tick()}break;
  }
});

/* ---------- backup ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ziua-mea-'+ds(new Date())+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
$('#file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.templates))throw 0;S=Object.assign(defaults(),d);save();alert('Backup importat');closeSheet();tick()}
  catch(x){alert('Fișier invalid')}
  e.target.value='';
};

/* ---------- start ---------- */
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();render()}});
tick();render();
</script>
